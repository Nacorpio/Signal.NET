name: Docs

# Builds the DocFX site (guides from docs/ + API reference from XML comments) and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "*.md", "docfx.json", "toc.yml", "api/index.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # The project SDK from global.json, plus the .NET 10 runtime that the docfx tool runs on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build site
        run: dotnet docfx docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

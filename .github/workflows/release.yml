name: Release

# Publishing a release:
#   1. Move the "Unreleased" entries in CHANGELOG.md under a new "## [x.y.z] - YYYY-MM-DD" heading.
#   2. Commit, then tag and push:  git tag v0.2.0 && git push origin v0.2.0
#      (pre-releases: v0.2.0-preview.1)
# The version of every package comes from the tag (MinVer).
#
# Publishing uses NuGet Trusted Publishing (OIDC): no long-lived API key is stored anywhere.
# https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
#
# One-time configuration:
#   - nuget.org → your username → Trusted Publishing → add a policy:
#       Repository Owner: Nacorpio   Repository: Signal.NET   Workflow File: release.yml   Environment: nuget
#       Scopes: "Push new packages" + "Push new package versions", Glob pattern: Signal.*
#       (the first release creates the package IDs; the glob keeps the policy away from your other packages)
#   - GitHub → Settings → Environments → create "nuget" (optionally with required reviewers to approve releases)
#     and add the environment secret NUGET_USER = your nuget.org username (profile name, not your email).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # request the GitHub OIDC token that nuget.org exchanges for a temporary API key

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, test, pack and publish
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - name: Verify package version matches tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for package in artifacts/*.nupkg; do
            case "$package" in
              *".$expected.nupkg") ;;
              *) echo "::error::$package does not match tag version $expected"; exit 1 ;;
            esac
          done

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Section between "## [version]" and the next "## [" heading (literal match: versions contain dots).
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version; using generated notes only."
          fi

      # The temporary key is valid for one hour, so request it right before pushing.
      - name: NuGet login (OIDC → temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Signal.NET ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --generate-notes \
            $prerelease

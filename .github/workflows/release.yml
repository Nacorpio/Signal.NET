name: Release

# Publishing a release:
#   1. Move the "Unreleased" entries in CHANGELOG.md under a new "## [x.y.z] - YYYY-MM-DD" heading.
#   2. Commit, then tag and push:  git tag v0.2.0 && git push origin v0.2.0
#      (pre-releases: v0.2.0-preview.1)
# The version of every package comes from the tag (MinVer).
#
# Required repository configuration:
#   - Secret NUGET_API_KEY: an API key from nuget.org scoped to push Signal.* packages.
#   - Optional environment "nuget" (Settings → Environments) to require approval before publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build, test, pack and publish
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - name: Verify package version matches tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for package in artifacts/*.nupkg; do
            case "$package" in
              *".$expected.nupkg") ;;
              *) echo "::error::$package does not match tag version $expected"; exit 1 ;;
            esac
          done

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Section between "## [version]" and the next "## [" heading (literal match: versions contain dots).
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version; using generated notes only."
          fi

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Signal.NET ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --generate-notes \
            $prerelease

name: Feature request
description: Suggest an API, endpoint or extension point.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Signal.NET makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch, affected layer (Domain / Application / Infrastructure / Hosting), related signal-cli-rest-api endpoint.
      render: csharp
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
